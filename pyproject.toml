[project]
name = "project-galaxiority"
version = "0.1.0"
description = "Space Game Project"
readme = "README.md"
authors = [
    { name = "Elinvar-labs", email = "shamin.pavel32@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "raylib-py", "pylint", "numpy", "scipy", "pillow",
    "pytest", "trimesh", "fast-simplification", "pymeshlab",
    "requests>=2.31"
]

[project.scripts]
project-galaxiority = "project_galaxiority.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"